  <script>
    // Registro de Service Worker para soporte Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));

    // CATEGORÍAS ESTILIZADAS CON TAXONOMÍA VISUAL
    const CATEGORIES = {

      utilities: { name: 'Servicios', icon: 'fa-bolt', color: 'text-amber-400', bg: 'bg-amber-500/15', border: 'border-amber-500/30' },
      restaurant: { name: 'Restaurante & Bares', icon: 'fa-utensils', color: 'text-rose-400', bg: 'bg-rose-500/15', border: 'border-rose-500/30' },
      transport: { name: 'Transporte', icon: 'fa-car-side', color: 'text-sky-400', bg: 'bg-sky-500/15', border: 'border-sky-500/30' },
      accommodation: { name: 'Alojamiento', icon: 'fa-bed', color: 'text-indigo-400', bg: 'bg-indigo-500/15', border: 'border-indigo-500/30' },
      entertainment: { name: 'Ocio & Salidas', icon: 'fa-ticket', color: 'text-purple-400', bg: 'bg-purple-500/15', border: 'border-purple-500/30' },
      general: { name: 'General', icon: 'fa-receipt', color: 'text-slate-300', bg: 'bg-slate-500/15', border: 'border-slate-500/30' }
    };

    // PERSISTENCIA LOCAL (Local Storage v2)
    const STORAGE_KEY = 'splitwallet_v2_data';

    function loadInitialState() {

              },
              { 
                id: 'exp_2', 
                desc: 'Wifi Fibertel 300MB', 
                amount: 14800, 
                paidBy: 'usr_male', 
                category: 'utilities', 
                date: 'Ayer, 10:15', 
                hasReceipt: false, 
                receiptNote: null,
                receiptImg: null 
              }
            ],
            settlements: []
          },
          {
            id: 'grp_2',
            name: 'Viaje a Bariloche',
            icon: 'fa-mountain-sun',
            tag: 'Viaje & Vacaciones',
            currency: '$',
            members: ['usr_me', 'usr_male', 'usr_pedro'],
            expenses: [
              { 
                id: 'exp_3', 
                desc: 'Alquiler Cabaña Los Coihues', 
                amount: 90000, 
                paidBy: 'usr_me', 
                category: 'accommodation', 
                date: '12 Sep', 
                hasReceipt: true, 
                receiptNote: 'Comprobante Reserva Airbnb',
                receiptImg: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=700&auto=format&fit=crop&q=80' 
              },
              { 
                id: 'exp_4', 
                desc: 'Cena Chocolatería Mamuschka', 
                amount: 33000,

        ],

          { id: 'pexp_1', desc: 'Café de Especialidad', amount: 3500, category: 'restaurant', date: 'Hoy, 11:30' },
          { id: 'pexp_2', desc: 'Recarga SUBE', amount: 4000, category: 'transport', date: 'Ayer, 18:00' },
          { id: 'pexp_3', desc: 'Suscripción Spotify Duo', amount: 2800, category: 'entertainment', date: '05 Sep' },
          { id: 'pexp_4', desc: 'Farmacia & Vitaminas', amount: 9200, category: 'general', date: '02 Sep' }
        ]
      };
    }

    const state = loadInitialState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // TOAST FEEDBACK NOTIFICATIONS
    let toastTimeout = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast-container');
      const msgElem = document.getElementById('toast-message');
      const iconElem = document.getElementById('toast-icon');

      if (!toast || !msgElem || !iconElem) return;

      clearTimeout(toastTimeout);
      msgElem.innerText = message;

      if (type === 'success') {
        iconElem.className = 'fa-solid fa-circle-check text-emerald-400';
        toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-full bg-slate-900/95 border border-emerald-500/40 shadow-2xl shadow-emerald-950/60 backdrop-blur-xl flex items-center gap-2.5 text-xs text-white toast-active';
      } else if (type === 'info') {
        iconElem.className = 'fa-solid fa-circle-info text-blue-400';
        toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-full bg-slate-900/95 border border-blue-500/40 shadow-2xl shadow-blue-950/60 backdrop-blur-xl flex items-center gap-2.5 text-xs text-white toast-active';
      }

      toast.classList.remove('hidden');
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2600);
    }

    // ALGORITMO CONTABLE EXACTO DE SIMPLIFICACIÓN DE DEUDAS
    function calculateGroupBalances(group) {
      const netMap = {};
      group.members.forEach(m => netMap[m] = 0);

      group.expenses.forEach(exp => {
        const count = group.members.length;
        const share = exp.amount / count;
        netMap[exp.paidBy] += exp.amount;
        group.members.forEach(m => netMap[m] -= share);
      });

      group.settlements.forEach(set => {
        netMap[set.from] += set.amount;
        netMap[set.to] -= set.amount;
      });

      const debtors = [];
      const creditors = [];

      for (const [uid, net] of Object.entries(netMap)) {
        if (net < -0.01) debtors.push({ uid, amount: Math.abs(net) });
        else if (net > 0.01) creditors.push({ uid, amount: net });
      }

      const simplified = [];
      let dIdx = 0, cIdx = 0;

      while (dIdx < debtors.length && cIdx < creditors.length) {
        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transfer = Math.min(debtors[dIdx].amount, creditors[cIdx].amount);
        if (transfer > 0.01) {
          simplified.push({
            from: debtors[dIdx].uid,
            to: creditors[cIdx].uid,
            amount: transfer
          });
        }

        debtors[dIdx].amount -= transfer;
        creditors[cIdx].amount -= transfer;

        if (debtors[dIdx].amount < 0.01) dIdx++;
        if (creditors[cIdx].amount < 0.01) cIdx++;
      }

      return { netMap, simplified };
    }

    function getUser(id) {
      return state.users.find(u => u.id === id) || { id, name: 'Usuario', alias: 'usuario.mp', color: 'from-slate-600 to-slate-700', initials: 'U' };
    }

    // RENDERIZADO GLOBAL
    function render() {
      const container = document.getElementById('screen-container');
      if (!container) return;

      if (state.activeTab === 'personal') {
        renderPersonalTab(container);
      } else {
        if (state.currentView === 'group-list') {
          renderGroupList(container);
        } else {
          renderGroupDetail(container);
        }
      }

      // Actualizar Tab Bar UI
      const isGroups = state.activeTab === 'groups';
      document.getElementById('tab-btn-groups').className = isGroups
        ? 'relative py-1.5 px-4 rounded-2xl flex flex-col items-center gap-1 transition-all duration-200 text-brand-400 font-semibold'
        : 'relative py-1.5 px-4 rounded-2xl flex flex-col items-center gap-1 transition-all duration-200 text-slate-400 hover:text-white';
      
      document.getElementById('tab-btn-personal').className = !isGroups
        ? 'relative py-1.5 px-4 rounded-2xl flex flex-col items-center gap-1 transition-all duration-200 text-brand-400 font-semibold'
        : 'relative py-1.5 px-4 rounded-2xl flex flex-col items-center gap-1 transition-all duration-200 text-slate-400 hover:text-white';

      document.getElementById('tab-indicator-groups').classList.toggle('hidden', !isGroups);
      document.getElementById('tab-indicator-personal').classList.toggle('hidden', isGroups);

      saveState();
    }

    // PANTALLA 1: LISTADO DE GRUPOS & BALANCE CONSOLIDADO
    function renderGroupList(container) {
      let totalOwed = 0;
      let totalOwes = 0;

      state.groups.forEach(g => {
        const { netMap } = calculateGroupBalances(g);
        const myNet = netMap[state.currentUser.id] || 0;
        if (myNet > 0) totalOwed += myNet;
        if (myNet < 0) totalOwes += Math.abs(myNet);
      });

      const netTotal = totalOwed - totalOwes;

      container.innerHTML = `
        <!-- Hero Balance Card (Fintech OLED Design) -->
        <div class="relative overflow-hidden rounded-3xl p-5 mb-5 border border-white/10 shadow-2xl bg-gradient-to-br from-indigo-950/60 via-slate-900/90 to-[#080d1a]">
          <div class="absolute -right-8 -top-8 w-36 h-36 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>
          
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-bold tracking-wider uppercase text-indigo-300/80 flex items-center gap-1.5">
              <i class="fa-solid fa-wallet text-[10px]"></i> Balance Consolidado
            </span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/10 font-mono text-slate-300">
              ${state.groups.length} Grupos
            </span>
          </div>

          <div class="my-2">
            <p class="text-3xl font-extrabold font-mono tracking-tight ${netTotal >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
              ${netTotal >= 0 ? '+' : '-'}$${Math.abs(netTotal).toLocaleString('es-AR')}
            </p>
            <p class="text-[11px] text-slate-400 mt-0.5">
              ${netTotal > 0 ? 'Tenés saldo neto a tu favor' : netTotal < 0 ? 'Tenés pagos pendientes por liquidar' : 'Estás completamente al día en todos tus grupos'}
            </p>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-white/10">
            <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl p-2.5 flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400 text-xs">
                <i class="fa-solid fa-arrow-trend-up"></i>
              </div>
              <div>
                <p class="text-[10px] text-emerald-300/70 font-medium">Te deben</p>
                <p class="text-xs font-bold font-mono text-emerald-400">+$${totalOwed.toLocaleString('es-AR')}</p>
              </div>
            </div>

            <div class="bg-rose-500/10 border border-rose-500/20 rounded-2xl p-2.5 flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-xl bg-rose-500/20 flex items-center justify-center text-rose-400 text-xs">
                <i class="fa-solid fa-arrow-trend-down"></i>
              </div>
              <div>
                <p class="text-[10px] text-rose-300/70 font-medium">Debés</p>
                <p class="text-xs font-bold font-mono text-rose-400">-$${totalOwes.toLocaleString('es-AR')}</p>
              </div>

    // MODAL SYSTEM (iOS Bottom Sheet)
    let tempReceiptBase64 = null;

    function openModal(title, formHtml, confirmActionText, onConfirm) {
      tempReceiptBase64 = null;
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="w-full max-h-[85vh] overflow-y-auto hide-scrollbar glass-panel border-t border-white/10 rounded-t-[32px] p-5 shadow-2xl animate-slide-up bg-[#0c1222]">
          <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-4"></div>
          
          <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/5">
            <h2 class="text-base font-bold text-white">${title}</h2>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-white/5 text-slate-400 hover:text-white flex items-center justify-center text-xs transition">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          ${formHtml}

          <div class="mt-5">
            <button id="modal-confirm-btn" class="w-full bg-brand-600 hover:bg-brand-500 active:scale-[0.98] text-white font-bold text-sm py-3.5 rounded-2xl shadow-xl shadow-brand-600/30 transition">
              ${confirmActionText}
            </button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');

      document.getElementById('modal-confirm-btn').onclick = () => {
        const success = onConfirm();
        if (success !== false) closeModal();
      };
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      modal.classList.add('hidden');
      tempReceiptBase64 = null;
    }

    // ROADMAP #2: SUBIDA Y ADJUNTO DE COMPROBANTES
    function handleReceiptUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        tempReceiptBase64 = e.target.result;
        const previewContainer = document.getElementById('receipt-preview-box');
        const uploadButtonLabel = document.getElementById('receipt-upload-label');
        if (previewContainer && uploadButtonLabel) {
          previewContainer.innerHTML = `
            <div class="relative rounded-xl overflow-hidden border border-brand-500/40 mt-2">
              <img src="${tempReceiptBase64}" class="w-full h-32 object-cover" />
              <button onclick="removeUploadedReceipt(event)" class="absolute top-2 right-2 w-6 h-6 rounded-full bg-black/70 text-rose-400 flex items-center justify-center text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
              <div class="absolute bottom-0 inset-x-0 bg-black/60 px-2 py-1 text-[10px] text-emerald-300 font-mono truncate">
                ✓ Comprobante listo para adjuntar
              </div>
            </div>
          `;
          uploadButtonLabel.innerText = "Cambiar Comprobante";
        }
      };
      reader.readAsDataURL(file);
    }

    function removeUploadedReceipt(e) {
      if (e) e.stopPropagation();
      tempReceiptBase64 = null;
      const previewContainer = document.getElementById('receipt-preview-box');
      const uploadButtonLabel = document.getElementById('receipt-upload-label');
      if (previewContainer) previewContainer.innerHTML = '';
      if (uploadButtonLabel) uploadButtonLabel.innerText = "Adjuntar Foto de Ticket";
    }

    // MODAL: CARGAR GASTO COMPARTIDO (CON ADJUNTO DE RECIBO ROADMAP #2)
    function openAddExpenseModal() {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      if (!group) return;

      const formHtml = `
        <div class="space-y-3.5 text-xs">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Monto del Gasto ($)</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-mono font-bold text-slate-400 text-lg">$</span>
              <input id="input-exp-amount" type="number" placeholder="0.00" class="w-full pl-8 pr-4 py-3 rounded-2xl bg-surface-base border border-white/10 text-white font-mono font-bold text-xl focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition">
            </div>
          </div>

          <div>
            <label class="block text-slate-400 font-semibold mb-1">Descripción del Gasto</label>
            <input id="input-exp-desc" type="text" placeholder="ej. Asado, Supermercado, Alquiler" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white focus:border-brand-500 outline-none transition">
          </div>

          <div>
            <label class="block text-slate-400 font-semibold mb-1">Categoría</label>
            <select id="input-exp-cat" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white focus:border-brand-500 outline-none">
              ${Object.entries(CATEGORIES).map(([k, v]) => `
                <option value="${k}">${v.name}</option>
              `).join('')}
            </select>
          </div>

          <div>
            <label class="block text-slate-400 font-semibold mb-1">¿Quién pagó el monto total?</label>
            <select id="input-exp-payer" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white focus:border-brand-500 outline-none">
              ${group.members.map(m => `
                <option value="${m}" ${m === state.currentUser.id ? 'selected' : ''}>${getUser(m).name}</option>
              `).join('')}
            </select>
          </div>

          <div class="pt-1">
            <label class="block text-slate-400 font-semibold mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-camera text-brand-400"></i> Comprobante o Foto de Ticket (Roadmap #2)
            </label>
            
            <input type="file" id="input-exp-file" accept="image/*" class="hidden" onchange="handleReceiptUpload(event)" />
            
            <label for="input-exp-file" class="w-full cursor-pointer py-2.5 px-3 rounded-xl border border-dashed border-white/20 hover:border-brand-400/60 bg-white/5 flex items-center justify-center gap-2 text-slate-300 hover:text-white transition">
              <i class="fa-solid fa-paperclip text-brand-400"></i>
              <span id="receipt-upload-label" class="font-medium">Adjuntar Foto de Ticket</span>
            </label>

            <div id="receipt-preview-box"></div>
          </div>
        </div>
      `;

      openModal('Cargar Gasto Compartido', formHtml, 'Guardar Gasto', () => {
        const amount = parseFloat(document.getElementById('input-exp-amount').value);
        const desc = document.getElementById('input-exp-desc').value.trim();
        const cat = document.getElementById('input-exp-cat').value;
        const payer = document.getElementById('input-exp-payer').value;

        if (!amount || amount <= 0) {
          showToast('Ingresá un monto válido mayor a 0', 'info');
          return false;
        }
        if (!desc) {
          showToast('Ingresá una descripción para el gasto', 'info');
          return false;
        }

        group.expenses.unshift({
          id: 'exp_' + Date.now(),
          desc: desc,
          amount: amount,
          paidBy: payer,
          category: cat,
          date: 'Hoy',
          hasReceipt: !!tempReceiptBase64,
          receiptNote: tempReceiptBase64 ? 'Comprobante adjuntado' : null,
          receiptImg: tempReceiptBase64
        });

        showToast('Gasto registrado con éxito', 'success');
        render();
        return true;
      });
    }

    // MODAL: DETALLE Y VISUALIZADOR DE COMPROBANTES (Roadmap #2)
    function openExpenseDetailModal(groupId, expenseId) {
      const group = state.groups.find(g => g.id === groupId);
      if (!group) return;
      const expense = group.expenses.find(e => e.id === expenseId);
      if (!expense) return;

      const cat = CATEGORIES[expense.category] || CATEGORIES.general;
      const payer = getUser(expense.paidBy);
      const splitPerMember = (expense.amount / group.members.length);

      const formHtml = `
        <div class="space-y-4 text-xs">
          <div class="flex items-center gap-3 p-3 rounded-2xl bg-surface-base border border-white/10">
            <div class="w-12 h-12 rounded-xl ${cat.bg} ${cat.border} border ${cat.color} flex items-center justify-center text-lg">
              <i class="fa-solid ${cat.icon}"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-white">${expense.desc}</h3>
              <p class="text-[11px] text-slate-400 mt-0.5">${cat.name} • Fecha: ${expense.date}</p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-center">
            <div class="p-3 rounded-xl bg-white/5 border border-white/10">
              <p class="text-[10px] text-slate-400">Total Pagado</p>
              <p class="text-base font-mono font-bold text-white">$${expense.amount.toLocaleString('es-AR')}</p>
              <p class="text-[9px] text-slate-400 mt-0.5">por ${payer.name}</p>
            </div>
            <div class="p-3 rounded-xl bg-white/5 border border-white/10">
              <p class="text-[10px] text-slate-400">Tu Parte</p>
              <p class="text-base font-mono font-bold text-brand-400">$${splitPerMember.toLocaleString('es-AR')}</p>
              <p class="text-[9px] text-slate-400 mt-0.5">(${group.members.length} participantes)</p>
            </div>
          </div>

          <div>
            <p class="font-semibold text-slate-300 mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-receipt text-indigo-400"></i> Comprobante Adjunto
            </p>

            ${expense.hasReceipt && expense.receiptImg ? `
              <div class="relative rounded-2xl overflow-hidden border border-white/15 shadow-xl">
                <img src="${expense.receiptImg}" alt="Ticket de ${expense.desc}" class="w-full max-h-60 object-cover" />
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-2 text-center">
                  <span class="text-[10px] text-white font-mono">${expense.receiptNote || 'Comprobante verificado'}</span>
                </div>
              </div>
            ` : `
              <div class="p-4 rounded-xl bg-white/5 border border-dashed border-white/15 text-center text-slate-400">
                <i class="fa-solid fa-image text-lg mb-1 block text-slate-500"></i>
                <span>Este gasto no posee foto de comprobante adjunta</span>
              </div>
            `}
          </div>
        </div>
      `;

      openModal('Detalle del Gasto', formHtml, 'Cerrar', () => true);
    }

    // MODAL: EXPORTAR RESUMEN (Roadmap #3 - Editorial WhatsApp / PDF Summary)
    function openExportModal(groupId) {
      const group = state.groups.find(g => g.id === groupId);
      if (!group) return;

      const { simplified } = calculateGroupBalances(group);
      const totalGroupSpent = group.expenses.reduce((acc, x) => acc + x.amount, 0);

      let summaryText = `📊 *SplitWallet — Resumen de Cuentas: ${group.name}*\n`;
      summaryText += `💰 *Gasto Total del Grupo:* $${totalGroupSpent.toLocaleString('es-AR')}\n\n`;
      summaryText += `*Liquidaciones sugeridas:*\n`;

      if (simplified.length === 0) {
        summaryText += `✅ ¡Todas las cuentas están saldadas en cero!\n`;
      } else {
        simplified.forEach(s => {
          const debtor = getUser(s.from);
          const creditor = getUser(s.to);
          summaryText += `• ${debtor.name} le transfiere a ${creditor.name}: $${s.amount.toLocaleString('es-AR')}\n  (Alias: ${creditor.alias})\n`;
        });
      }
      summaryText += `\nGenerado con SplitWallet Mobile.`;

      window.currentExportText = summaryText;

      const formHtml = `
        <div class="space-y-3 text-xs">
          <p class="text-slate-400">Copiá este resumen listo para compartir en el grupo de WhatsApp o descargar:</p>
          
          <div class="p-3.5 rounded-2xl bg-surface-base border border-white/10 font-mono text-[11px] text-slate-200 whitespace-pre-line select-all">
            ${summaryText}
          </div>

          <div class="flex gap-2">
            <button onclick="copyExportSummary()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition">
              <i class="fa-solid fa-copy"></i> Copiar para WhatsApp
            </button>
          </div>
        </div>
      `;

      openModal('Exportar Resumen (Roadmap #3)', formHtml, 'Listo', () => true);
    }

    function copyExportSummary() {
      if (window.currentExportText) {
        copyToClipboard(window.currentExportText);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('¡Resumen copiado al portapapeles!', 'success');
      }).catch(() => {
        showToast('No se pudo copiar automáticamente', 'info');
      });
    }

    // MODAL: SALDAR CUENTAS / LIQUIDACIÓN (Roadmap #5 con Alias & MP)
    function openSettleModal(prefillTo = null, prefillAmount = null) {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      if (!group) return;

      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Monto a Transferir ($)</label>
            <input id="input-set-amount" type="number" value="${prefillAmount || ''}" placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white font-mono font-bold text-lg focus:border-brand-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 font-semibold mb-1">¿Quién transfiere?</label>
              <select id="input-set-from" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white outline-none" onchange="updateSettlementAlias()">
                ${group.members.map(m => `
                  <option value="${m}" ${m === state.currentUser.id ? 'selected' : ''}>${getUser(m).name}</option>
                `).join('')}
              </select>
            </div>
            <div>
              <label class="block text-slate-400 font-semibold mb-1">¿Quién recibe?</label>
              <select id="input-set-to" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white outline-none" onchange="updateSettlementAlias()">
                ${group.members.map((m, i) => `
                  <option value="${m}" ${(prefillTo ? m === prefillTo : i === 1) ? 'selected' : ''}>${getUser(m).name}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div class="p-3 rounded-2xl bg-white/5 border border-white/10">
            <div class="flex justify-between items-center mb-1.5">
              <span class="font-semibold text-slate-300 flex items-center gap-1.5">
                <i class="fa-solid fa-building-columns text-emerald-400"></i> Datos de Transferencia
              </span>
              <span class="text-[10px] text-emerald-400 font-mono">CVU / Alias</span>
            </div>
            
            <div class="flex items-center justify-between bg-surface-base p-2 rounded-xl border border-white/5">
              <span id="settlement-alias-text" class="font-mono text-white text-xs select-all">male.alvarez.mp</span>
              <button type="button" onclick="copyAliasFromModal()" class="px-2 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 text-[10px] font-bold active:scale-95 transition">
                Copiar
              </button>
            </div>
          </div>
        </div>
      `;

      openModal('Registrar Liquidación / Pago', formHtml, 'Confirmar y Saldar', () => {
        const amount = parseFloat(document.getElementById('input-set-amount').value);
        const from = document.getElementById('input-set-from').value;
        const to = document.getElementById('input-set-to').value;

        if (!amount || amount <= 0) {
          showToast('Ingresá un monto válido', 'info');
          return false;
        }
        if (from === to) {
          showToast('El pagador y receptor no pueden ser la misma persona', 'info');
          return false;
        }

        group.settlements.unshift({
          id: 'set_' + Date.now(),
          amount: amount,
          from: from,
          to: to,
          date: 'Hoy',
          method: 'Transferencia'
        });

        showToast('Pago registrado correctamente', 'success');
        render();
        return true;
      });

      setTimeout(updateSettlementAlias, 50);
    }

    function quickPay(toUserId, amount) {
      openSettleModal(toUserId, amount);
    }

    function updateSettlementAlias() {
      const toElem = document.getElementById('input-set-to');
      const aliasElem = document.getElementById('settlement-alias-text');
      if (toElem && aliasElem) {
        const u = getUser(toElem.value);
        aliasElem.innerText = u.alias || 'alias.split.mp';
      }
    }

    function copyAliasFromModal() {
      const aliasElem = document.getElementById('settlement-alias-text');
      if (aliasElem) {
        copyToClipboard(aliasElem.innerText);
      }
    }

    // MODAL: CREAR GRUPO
    function openCreateGroupModal() {
      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Nombre del Grupo</label>
            <input id="input-grp-name" type="text" placeholder="ej. Asado del Sábado, Viaje a Río" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white focus:border-brand-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Tipo de Grupo</label>
            <select id="input-grp-icon" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white outline-none">
              <option value="fa-house">Hogar / Roommates</option>
              <option value="fa-plane">Viajes & Vacaciones</option>
              <option value="fa-utensils">Salidas & Cenas</option>
              <option value="fa-users">Amigos & Eventos</option>
            </select>
          </div>
        </div>
      `;

      openModal('Crear Nuevo Grupo', formHtml, 'Crear Grupo', () => {
        const name = document.getElementById('input-grp-name').value.trim();
        const icon = document.getElementById('input-grp-icon').value;
        if (!name) {
          showToast('Ingresá el nombre del grupo', 'info');
          return false;
        }

        state.groups.unshift({
          id: 'grp_' + Date.now(),
          name: name,
          icon: icon,
          tag: 'Nuevo',
          currency: '$',
          members: ['usr_me', 'usr_male'],
          expenses: [],
          settlements: []
        });

        showToast('Grupo creado exitosamente', 'success');
        render();
        return true;
      });
    }

    // MODAL: CARGAR GASTO PERSONAL
    function openAddPersonalModal() {
      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Monto ($)</label>
            <input id="input-p-amount" type="number" placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white font-mono font-bold text-lg focus:border-brand-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Descripción</label>
            <input id="input-p-desc" type="text" placeholder="ej. Supermercado, Farmacia, Combustible" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white focus:border-brand-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Rubro</label>
            <select id="input-p-cat" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-base border border-white/10 text-white outline-none">
              ${Object.entries(CATEGORIES).map(([k, v]) => `
                <option value="${k}">${v.name}</option>
              `).join('')}
            </select>
          </div>
        </div>
      `;

      openModal('Cargar Gasto Personal', formHtml, 'Guardar Movimiento', () => {
        const amount = parseFloat(document.getElementById('input-p-amount').value);
        const desc = document.getElementById('input-p-desc').value.trim();
        const cat = document.getElementById('input-p-cat').value;

        if (!amount || amount <= 0 || !desc) {
          showToast('Completá los campos correctamente', 'info');
          return false;
        }

        state.personalExpenses.unshift({
          id: 'pexp_' + Date.now(),
          desc: desc,
          amount: amount,
          category: cat,
          date: 'Hoy'
        });

        showToast('Gasto personal registrado', 'success');
        render();
        return true;
      });
    }

    // MODAL: INVITAR MIEMBROS
    function openInviteModal() {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      if (!group) return;
      const code = 'SPLIT-' + Math.floor(1000 + Math.random() * 9000);

      const formHtml = `
        <div class="text-center py-2 text-xs">
          <p class="text-slate-400 mb-2">Compartí este código o link con tus amigos:</p>
          <p class="text-2xl font-mono font-bold tracking-widest text-indigo-300 bg-surface-base py-3 rounded-2xl border border-white/10 select-all">${code}</p>
          <p class="text-[11px] text-slate-400 mt-2">https://splitwallet.app/join/${code}</p>
          <button onclick="copyToClipboard('https://splitwallet.app/join/${code}')" class="mt-3 px-4 py-2 rounded-xl bg-white/10 text-white font-semibold active:scale-95 transition">
            Copiar Link de Invitación
          </button>
        </div>
      `;
      openModal(`Invitar a ${group.name}`, formHtml, 'Listo', () => true);
    }

    // MODAL: INFO ROADMAP
    function openRoadmapInfo() {
      const formHtml = `
        <div class="space-y-3 text-xs text-slate-300">
          <p class="font-bold text-white">🚀 SplitWallet Roadmap en Marcha:</p>
          <ul class="space-y-2">
            <li class="p-2 rounded-xl bg-white/5 border border-white/5">
              <span class="text-emerald-400 font-bold">✓ Caso #1:</span> Modo Gasto Personal & Presupuestos.
            </li>
            <li class="p-2 rounded-xl bg-white/5 border border-white/5">
              <span class="text-emerald-400 font-bold">✓ Caso #2:</span> Adjunto y visor de comprobantes/tickets.
            </li>
            <li class="p-2 rounded-xl bg-white/5 border border-white/5">
              <span class="text-emerald-400 font-bold">✓ Caso #3:</span> Exportación editorial para WhatsApp.
            </li>
            <li class="p-2 rounded-xl bg-white/5 border border-white/5">
              <span class="text-emerald-400 font-bold">✓ Caso #5:</span> Liquidación con Alias y CVU local.
            </li>
          </ul>
        </div>
      `;
      openModal('Estado de Evolución de Producto', formHtml, 'Entendido', () => true);
    }

    // NAVEGACIÓN Y RELOJ
    function switchTab(tab) {
      state.activeTab = tab;
      render();
    }

    function openGroupDetail(groupId) {
      state.selectedGroupId = groupId;
      state.currentView = 'group-detail';
      render();
    }

    function backToGroups() {
      state.currentView = 'group-list';
      render();
    }

    function toggleCurrency() {
      state.currency = state.currency === 'ARS' ? 'USD' : 'ARS';
      document.getElementById('currency-badge').innerText = `${state.currency} ($)`;
      showToast(`Moneda activa: ${state.currency}`, 'info');
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const timeElem = document.getElementById('ios-time');
      if (timeElem) timeElem.innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Inicializar
    render();
  </script>
</body>
</html>
