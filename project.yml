name: SplitWallet
options:
  bundleIdPrefix: com.julietasleiman
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone

targets:
  SplitWallet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SplitWallet
        excludes:
          - "Tests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julietasleiman.splitwallet
        INFOPLIST_FILE: SplitWallet/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SplitWallet/Resources/SplitWallet.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic

  SplitWalletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SplitWallet/Tests/SplitWalletTests
    dependencies:
      - target: SplitWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julietasleiman.splitwallet.tests
