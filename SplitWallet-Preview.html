<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitWallet — Simulador Interactivo iOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #0f172a;
      user-select: none;
    }
    .iphone-frame {
      width: 390px;
      height: 844px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 12px #2d3748, 0 0 0 14px #1a202c;
      border-radius: 54px;
      overflow: hidden;
      position: relative;
    }
    .dynamic-island {
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }
    .home-indicator {
      width: 138px;
      height: 5px;
      background: #718096;
      border-radius: 3px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Encabezado de la herramienta de previsualización -->
  <div class="text-center mb-4 text-white">
    <div class="inline-flex items-center gap-2 bg-blue-600/30 border border-blue-500/40 px-3 py-1 rounded-full text-blue-300 text-xs font-medium mb-2">
      <i class="fa-brands fa-apple"></i> Entorno de Vista Previa para Windows
    </div>
    <h1 class="text-2xl font-bold">SplitWallet — Simulador Interactivo</h1>
    <p class="text-xs text-slate-400 mt-1 max-w-md">
      Simulación funcional con la misma lógica contable de Swift (<span class="text-emerald-400">BalanceCalculator</span>, simplificación de deudas, gastos personales y Swift Charts).
    </p>
  </div>

  <!-- Carcasa de iPhone -->
  <div class="iphone-frame bg-slate-900 text-white flex flex-col">
    <!-- Dynamic Island -->
    <div class="dynamic-island">
      <div class="w-3 h-3 rounded-full bg-slate-900"></div>
      <div class="w-2.5 h-2.5 rounded-full bg-blue-900/60 border border-blue-500/50"></div>
    </div>

    <!-- Barra de Estado de iOS -->
    <div class="pt-3.5 px-7 flex justify-between items-center text-xs font-semibold text-white/90 z-40">
      <span id="ios-time">9:41</span>
      <div class="flex items-center gap-2 text-[10px]">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full text-xs"></i>
      </div>
    </div>

    <!-- Contenido de las Vistas (Scrollable) -->
    <div id="screen-container" class="flex-1 overflow-y-auto hide-scrollbar pt-6 pb-20 px-4">
      <!-- Se inyecta dinámicamente -->
    </div>

    <!-- Barra de Pestañas Inferior (MainTabView) -->
    <div class="h-16 bg-slate-900/95 border-t border-slate-800 backdrop-blur-md flex items-center justify-around px-6 absolute bottom-0 left-0 right-0 z-40">
      <button onclick="switchTab('groups')" id="tab-btn-groups" class="flex flex-col items-center gap-1 text-blue-500 transition-colors">
        <i class="fa-solid fa-user-group text-lg"></i>
        <span class="text-[10px] font-medium">Grupos</span>
      </button>
      <button onclick="switchTab('personal')" id="tab-btn-personal" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
        <i class="fa-solid fa-chart-pie text-lg"></i>
        <span class="text-[10px] font-medium">Mis Gastos</span>
      </button>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end">
      <!-- Inyectado por JS -->
    </div>
  </div>

  <script>
    // ESTADO DE LA APLICACIÓN
    const state = {
      activeTab: 'groups', // 'groups' | 'personal'
      currentView: 'group-list', // 'group-list' | 'group-detail'
      selectedGroupId: 'grp_1',
      selectedMonth: new Date(),
      searchQuery: '',
      selectedCategoryFilter: null,
      currentUser: { id: 'usr_me', name: 'Juan (Tú)' },
      users: [
        { id: 'usr_me', name: 'Juan (Tú)' },
        { id: 'usr_male', name: 'Male' },
        { id: 'usr_pedro', name: 'Pedro' }
      ],
      groups: [
        {
          id: 'grp_1',
          name: 'Depto con Male',
          currency: '$',
          members: ['usr_me', 'usr_male'],
          expenses: [
            { id: 'exp_1', desc: 'Supermercado Coto', amount: 30000, paidBy: 'usr_me', category: 'Supermercado', date: 'Hoy' },
            { id: 'exp_2', desc: 'Wifi Fibertel', amount: 15000, paidBy: 'usr_male', category: 'Servicios', date: 'Ayer' }
          ],
          settlements: []
        },
        {
          id: 'grp_2',
          name: 'Viaje a Bariloche',
          currency: '$',
          members: ['usr_me', 'usr_male', 'usr_pedro'],
          expenses: [
            { id: 'exp_3', desc: 'Alquiler Cabaña', amount: 90000, paidBy: 'usr_me', category: 'Alojamiento', date: '12 Sep' },
            { id: 'exp_4', desc: 'Cena Chocolatería', amount: 30000, paidBy: 'usr_pedro', category: 'Restaurante', date: '11 Sep' }
          ],
          settlements: []
        }
      ],
      personalExpenses: [
        { id: 'pexp_1', desc: 'Café de Especialidad', amount: 3500, category: 'Alimentación', date: 'Hoy' },
        { id: 'pexp_2', desc: 'Recarga SUBE', amount: 4000, category: 'Transporte', date: 'Ayer' },
        { id: 'pexp_3', desc: 'Suscripción Spotify', amount: 2800, category: 'Suscripciones', date: '05 Sep' },
        { id: 'pexp_4', desc: 'Cine & Pochoclos', amount: 8000, category: 'Ocio y Salidas', date: '03 Sep' }
      ]
    };

    // ALGORITMO CONTABLE EXACTO (BalanceCalculator replica)
    function calculateGroupBalances(group) {
      const netMap = {};
      group.members.forEach(m => netMap[m] = 0);

      // Procesar gastos (partes iguales por defecto en el simulador)
      group.expenses.forEach(exp => {
        const count = group.members.length;
        const share = exp.amount / count;
        netMap[exp.paidBy] += exp.amount;
        group.members.forEach(m => {
          netMap[m] -= share;
        });
      });

      // Procesar liquidaciones
      group.settlements.forEach(set => {
        netMap[set.from] += set.amount;
        netMap[set.to] -= set.amount;
      });

      // Simplificación de deudas greedy
      const debtors = [];
      const creditors = [];

      for (const [uid, net] of Object.entries(netMap)) {
        if (net < -0.01) debtors.push({ uid, amount: Math.abs(net) });
        else if (net > 0.01) creditors.push({ uid, amount: net });
      }

      const simplified = [];
      let dIdx = 0, cIdx = 0;

      while (dIdx < debtors.length && cIdx < creditors.length) {
        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transfer = Math.min(debtors[dIdx].amount, creditors[cIdx].amount);
        if (transfer > 0.01) {
          simplified.push({
            from: debtors[dIdx].uid,
            to: creditors[cIdx].uid,
            amount: transfer
          });
        }

        debtors[dIdx].amount -= transfer;
        creditors[cIdx].amount -= transfer;

        if (debtors[dIdx].amount < 0.01) dIdx++;
        if (creditors[cIdx].amount < 0.01) cIdx++;
      }

      return { netMap, simplified };
    }

    function getUserName(id) {
      const u = state.users.find(x => x.id === id);
      return u ? u.name : 'Usuario';
    }

    // RENDERIZADO PRINCIPAL
    function render() {
      const container = document.getElementById('screen-container');

      if (state.activeTab === 'personal') {
        renderPersonalTab(container);
      } else {
        if (state.currentView === 'group-list') {
          renderGroupList(container);
        } else {
          renderGroupDetail(container);
        }
      }

      // Actualizar tabs
      document.getElementById('tab-btn-groups').className = state.activeTab === 'groups'
        ? 'flex flex-col items-center gap-1 text-blue-500 transition-colors'
        : 'flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors';

      document.getElementById('tab-btn-personal').className = state.activeTab === 'personal'
        ? 'flex flex-col items-center gap-1 text-blue-500 transition-colors'
        : 'flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors';
    }

    // PANTALLA: LISTA DE GRUPOS
    function renderGroupList(container) {
      let totalOwed = 0;
      let totalOwes = 0;

      state.groups.forEach(g => {
        const { netMap } = calculateGroupBalances(g);
        const myNet = netMap[state.currentUser.id] || 0;
        if (myNet > 0) totalOwed += myNet;
        if (myNet < 0) totalOwes += Math.abs(myNet);
      });

      const netTotal = totalOwed - totalOwes;

      container.innerHTML = `
        <div class="flex justify-between items-center mb-5">
          <h1 class="text-2xl font-bold tracking-tight">SplitWallet</h1>
          <button onclick="openCreateGroupModal()" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-semibold hover:bg-blue-500 transition">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Tarjeta de Resumen Consolidado -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 mb-6 shadow-sm">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Balance Consolidado</span>
          <div class="grid grid-cols-3 gap-2 mt-3 pt-2 border-t border-slate-700/50">
            <div>
              <p class="text-[10px] text-slate-400 font-medium">Te deben</p>
              <p class="text-base font-bold text-emerald-400">$${totalOwed.toLocaleString('es-AR')}</p>
            </div>
            <div class="border-x border-slate-700/50 px-2">
              <p class="text-[10px] text-slate-400 font-medium">Debés</p>
              <p class="text-base font-bold text-rose-400">$${totalOwes.toLocaleString('es-AR')}</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-400 font-medium">Neto</p>
              <p class="text-base font-bold ${netTotal >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                $${Math.abs(netTotal).toLocaleString('es-AR')}
              </p>
            </div>
          </div>
        </div>

        <!-- Lista de Grupos -->
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-semibold text-slate-300">Tus Grupos (${state.groups.length})</h2>
        </div>

        <div class="space-y-2.5">
          ${state.groups.map(g => {
            const { netMap } = calculateGroupBalances(g);
            const myNet = netMap[state.currentUser.id] || 0;
            return `
              <div onclick="openGroupDetail('${g.id}')" class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 rounded-2xl p-3.5 flex items-center justify-between cursor-pointer transition">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center font-semibold">
                    <i class="fa-solid fa-users"></i>
                  </div>
                  <div>
                    <h3 class="font-semibold text-sm leading-tight text-white">${g.name}</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5">${g.members.length} miembros</p>
                  </div>
                </div>
                <div class="text-right">
                  ${myNet > 0 ? `
                    <span class="text-xs font-bold text-emerald-400 block">+$${myNet.toLocaleString('es-AR')}</span>
                    <span class="text-[10px] text-emerald-400/80">te deben</span>
                  ` : myNet < 0 ? `
                    <span class="text-xs font-bold text-rose-400 block">-$${Math.abs(myNet).toLocaleString('es-AR')}</span>
                    <span class="text-[10px] text-rose-400/80">debés</span>
                  ` : `
                    <span class="text-xs font-medium text-slate-400 block">Al día</span>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // PANTALLA: DETALLE DE GRUPO
    function renderGroupDetail(container) {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      if (!group) return;

      const { netMap, simplified } = calculateGroupBalances(group);
      const myNet = netMap[state.currentUser.id] || 0;

      container.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <button onclick="backToGroups()" class="text-blue-400 text-sm flex items-center gap-1.5 font-medium hover:text-blue-300">
            <i class="fa-solid fa-chevron-left text-xs"></i> Grupos
          </button>
          <div class="flex gap-2">
            <button onclick="openInviteModal()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xs text-blue-400">
              <i class="fa-solid fa-user-plus"></i>
            </button>
            <button onclick="openAddExpenseModal()" class="w-7 h-7 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-xs text-white">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <h1 class="text-xl font-bold mb-3">${group.name}</h1>

        <!-- Tarjeta de Saldo Personal -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 text-center mb-5">
          <p class="text-xs text-slate-400 font-medium">Tu Balance en el Grupo</p>
          <p class="text-3xl font-extrabold mt-1 ${myNet > 0 ? 'text-emerald-400' : myNet < 0 ? 'text-rose-400' : 'text-slate-300'}">
            $${Math.abs(myNet).toLocaleString('es-AR')}
          </p>
          <p class="text-[11px] font-semibold mt-0.5 ${myNet > 0 ? 'text-emerald-400' : myNet < 0 ? 'text-rose-400' : 'text-slate-400'}">
            ${myNet > 0 ? 'Te deben en total' : myNet < 0 ? 'Debés en total' : 'Estás totalmente al día'}
          </p>

          <button onclick="openSettleModal()" class="mt-3.5 bg-blue-600 hover:bg-blue-500 text-xs font-semibold px-5 py-2 rounded-xl text-white shadow-sm transition">
            <i class="fa-solid fa-handshake mr-1.5"></i> Saldar / Registrar Pago
          </button>
        </div>

        <!-- Deudas Simplificadas -->
        ${simplified.length > 0 ? `
          <div class="mb-5">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Saldos Simplificados</h3>
            <div class="bg-slate-800/40 border border-slate-700/40 rounded-xl divide-y divide-slate-700/40">
              ${simplified.map(s => `
                <div class="p-3 flex items-center justify-between text-xs">
                  <div class="flex items-center gap-2">
                    <span class="font-medium text-white">${getUserName(s.from)}</span>
                    <span class="text-slate-400">le debe a</span>
                    <span class="font-medium text-white">${getUserName(s.to)}</span>
                  </div>
                  <span class="font-bold text-blue-400">$${s.amount.toLocaleString('es-AR')}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Historial de Gastos -->
        <div class="flex justify-between items-center mb-2.5">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Historial de Gastos (${group.expenses.length})</h3>
        </div>

        <div class="space-y-2">
          ${group.expenses.map(e => `
            <div class="bg-slate-800/50 border border-slate-700/40 rounded-xl p-3 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center text-xs">
                  <i class="fa-solid fa-receipt"></i>
                </div>
                <div>
                  <p class="text-xs font-semibold text-white leading-tight">${e.desc}</p>
                  <p class="text-[10px] text-slate-400 mt-0.5">Pagó ${getUserName(e.paidBy)} • ${e.date}</p>
                </div>
              </div>
              <span class="text-xs font-bold text-white">$${e.amount.toLocaleString('es-AR')}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // PANTALLA: PESTAÑA MIS GASTOS PERSONALES
    function renderPersonalTab(container) {
      const totalPersonal = state.personalExpenses.reduce((acc, curr) => acc + curr.amount, 0);

      // Calcular distribución por categoría
      const catMap = {};
      state.personalExpenses.forEach(e => {
        catMap[e.category] = (catMap[e.category] || 0) + e.amount;
      });

      const categories = Object.entries(catMap).map(([name, amount]) => ({
        name,
        amount,
        pct: Math.round((amount / totalPersonal) * 100)
      })).sort((a, b) => b.amount - a.amount);

      container.innerHTML = `
        <div class="flex justify-between items-center mb-5">
          <h1 class="text-2xl font-bold tracking-tight">Mis Gastos</h1>
          <button onclick="openAddPersonalModal()" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-semibold hover:bg-blue-500 transition">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Selector de Mes y Total -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 text-center mb-5 shadow-sm">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-400 mb-3 px-2">
            <button class="p-1 hover:text-white"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="text-white font-bold text-sm">Septiembre 2026</span>
            <button class="p-1 hover:text-white"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="pt-2 border-t border-slate-700/50">
            <p class="text-[11px] text-slate-400 font-medium">Total Gastado en el Mes</p>
            <p class="text-3xl font-extrabold text-white mt-1">$${totalPersonal.toLocaleString('es-AR')}</p>
          </div>
        </div>

        <!-- Gráfico de Barras por Categoría (Swift Charts simulation) -->
        <div class="mb-5">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5">Distribución por Categoría</h3>
          <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 space-y-3">
            ${categories.map(c => `
              <div>
                <div class="flex justify-between text-xs font-medium mb-1">
                  <span class="text-slate-300">${c.name}</span>
                  <span class="text-white font-semibold">$${c.amount.toLocaleString('es-AR')} <span class="text-slate-400 font-normal">(${c.pct}%)</span></span>
                </div>
                <div class="w-full h-2 bg-slate-700/60 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full" style="width: ${c.pct}%"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Historial Personal -->
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Historial (${state.personalExpenses.length})</h3>
        <div class="space-y-2">
          ${state.personalExpenses.map(p => `
            <div class="bg-slate-800/40 border border-slate-700/40 rounded-xl p-3 flex items-center justify-between">
              <div>
                <p class="text-xs font-semibold text-white">${p.desc}</p>
                <p class="text-[10px] text-slate-400">${p.category} • ${p.date}</p>
              </div>
              <span class="text-xs font-bold text-white">$${p.amount.toLocaleString('es-AR')}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // MODALES
    function openModal(title, formHtml, confirmActionText, onConfirm) {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="w-full bg-slate-800 border-t border-slate-700 rounded-t-3xl p-5 shadow-2xl animate-in slide-in-from-bottom duration-200">
          <div class="w-10 h-1 bg-slate-600 rounded-full mx-auto mb-4"></div>
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold text-white">${title}</h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xs font-medium">Cancelar</button>
          </div>
          ${formHtml}
          <button id="modal-confirm-btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm py-3 rounded-xl transition">
            ${confirmActionText}
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      document.getElementById('modal-confirm-btn').onclick = () => {
        onConfirm();
        closeModal();
      };
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    function openAddExpenseModal() {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Monto ($)</label>
            <input id="input-exp-amount" type="number" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-base focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Descripción</label>
            <input id="input-exp-desc" type="text" placeholder="ej. Supermercado, Nafta" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Pagado por</label>
            <select id="input-exp-payer" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
              ${group.members.map(m => `<option value="${m}">${getUserName(m)}</option>`).join('')}
            </select>
          </div>
        </div>
      `;

      openModal('Cargar Gasto Compartido', formHtml, 'Guardar Gasto', () => {
        const amount = parseFloat(document.getElementById('input-exp-amount').value);
        const desc = document.getElementById('input-exp-desc').value;
        const payer = document.getElementById('input-exp-payer').value;
        if (amount > 0 && desc.trim()) {
          group.expenses.unshift({
            id: 'exp_' + Date.now(),
            desc: desc.trim(),
            amount: amount,
            paidBy: payer,
            category: 'General',
            date: 'Hoy'
          });
          render();
        }
      });
    }

    function openSettleModal() {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Monto a pagar ($)</label>
            <input id="input-set-amount" type="number" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-base focus:border-blue-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Quién pagó</label>
              <select id="input-set-from" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
                ${group.members.map(m => `<option value="${m}">${getUserName(m)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Quién recibió</label>
              <select id="input-set-to" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
                ${group.members.map((m, i) => `<option value="${m}" ${i === 1 ? 'selected' : ''}>${getUserName(m)}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
      `;

      openModal('Registrar Liquidación / Pago', formHtml, 'Confirmar Pago', () => {
        const amount = parseFloat(document.getElementById('input-set-amount').value);
        const from = document.getElementById('input-set-from').value;
        const to = document.getElementById('input-set-to').value;
        if (amount > 0 && from !== to) {
          group.settlements.unshift({
            id: 'set_' + Date.now(),
            amount: amount,
            from: from,
            to: to,
            date: 'Hoy'
          });
          render();
        }
      });
    }

    function openInviteModal() {
      const group = state.groups.find(g => g.id === state.selectedGroupId);
      const code = 'SPLIT' + Math.floor(10 + Math.random() * 89);
      const formHtml = `
        <div class="text-center py-3">
          <p class="text-xs text-slate-400 mb-2">Compartí este código para invitar personas:</p>
          <p class="text-3xl font-mono font-bold tracking-widest text-white bg-slate-900 py-3 rounded-2xl border border-slate-700 select-all">${code}</p>
          <p class="text-[11px] text-blue-400 mt-2">https://splitwallet.app/join/${code}</p>
        </div>
      `;
      openModal(`Invitar a ${group.name}`, formHtml, 'Listo', () => {});
    }

    function openCreateGroupModal() {
      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Nombre del Grupo</label>
            <input id="input-grp-name" type="text" placeholder="ej. Asado del Sábado" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:border-blue-500 outline-none">
          </div>
        </div>
      `;
      openModal('Crear Nuevo Grupo', formHtml, 'Crear', () => {
        const name = document.getElementById('input-grp-name').value;
        if (name.trim()) {
          state.groups.unshift({
            id: 'grp_' + Date.now(),
            name: name.trim(),
            currency: '$',
            members: ['usr_me', 'usr_male'],
            expenses: [],
            settlements: []
          });
          render();
        }
      });
    }

    function openAddPersonalModal() {
      const formHtml = `
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Monto ($)</label>
            <input id="input-p-amount" type="number" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-base focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Descripción</label>
            <input id="input-p-desc" type="text" placeholder="ej. Farmacia, Almuerzo" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Categoría</label>
            <select id="input-p-cat" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
              <option value="Alimentación">Alimentación</option>
              <option value="Transporte">Transporte</option>
              <option value="Ocio y Salidas">Ocio y Salidas</option>
              <option value="Suscripciones">Suscripciones</option>
              <option value="Compras">Compras</option>
            </select>
          </div>
        </div>
      `;
      openModal('Cargar Gasto Personal', formHtml, 'Guardar Gasto', () => {
        const amount = parseFloat(document.getElementById('input-p-amount').value);
        const desc = document.getElementById('input-p-desc').value;
        const cat = document.getElementById('input-p-cat').value;
        if (amount > 0 && desc.trim()) {
          state.personalExpenses.unshift({
            id: 'pexp_' + Date.now(),
            desc: desc.trim(),
            amount: amount,
            category: cat,
            date: 'Hoy'
          });
          render();
        }
      });
    }

    // NAVEGACIÓN
    function switchTab(tab) {
      state.activeTab = tab;
      render();
    }

    function openGroupDetail(groupId) {
      state.selectedGroupId = groupId;
      state.currentView = 'group-detail';
      render();
    }

    function backToGroups() {
      state.currentView = 'group-list';
      render();
    }

    // Reloj dinámico
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('ios-time').innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Inicializar
    render();
  </script>
</body>
</html>
